<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Star Snatch</title>
<style>
  :root {
    --page: #e6e9f4;
    --ink: #1c2242;
    --muted: #59618a;
    --panel: #ffffff;
    --panel-edge: #cfd5ea;
    --gold: #f2a900;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page: #0d1226;
      --ink: #e9ecf8;
      --muted: #98a1c8;
      --panel: #182042;
      --panel-edge: #2a3466;
      --gold: #ffc93c;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --page: #0d1226;
    --ink: #e9ecf8;
    --muted: #98a1c8;
    --panel: #182042;
    --panel-edge: #2a3466;
    --gold: #ffc93c;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; height: 100%;
    background: var(--page); color: var(--ink);
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    overflow: hidden;
  }
  header {
    width: 100%; max-width: 900px;
    display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap;
    gap: 4px 16px; padding: 10px 14px 4px;
  }
  h1 { margin: 0; font-size: 1.6rem; letter-spacing: -0.02em; font-weight: 800; }
  h1 span { color: var(--gold); }
  .hint { margin: 0; color: var(--muted); font-size: 0.9rem; }
  #board {
    width: 100%; max-width: 900px;
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px;
    padding: 4px 14px 6px;
  }
  .chip {
    background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 10px;
    padding: 6px 8px; min-width: 0;
  }
  .chip-top { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; font-weight: 700; }
  .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
  .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .count { font-variant-numeric: tabular-nums; }
  .bar { height: 5px; border-radius: 3px; background: var(--panel-edge); margin-top: 5px; overflow: hidden; }
  .fill { height: 100%; border-radius: 3px; transition: width 0.15s ease-out; }
  #wrap {
    flex: 1; min-height: 0; width: 100%;
    display: flex; align-items: center; justify-content: center; padding: 4px 10px 10px;
  }
  #stage { position: relative; }
  canvas { display: block; border-radius: 16px; touch-action: none; }
  #overlay {
    position: absolute; inset: 0; border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(8, 12, 32, 0.72); color: #f3f5ff; text-align: center; padding: 20px;
  }
  #overlay[hidden] { display: none; }
  .card { max-width: 340px; }
  .card h2 { margin: 0 0 6px; font-size: 2rem; letter-spacing: -0.02em; }
  .card p { margin: 0 0 14px; color: #c3c9e8; line-height: 1.45; }
  .ranks { list-style: none; margin: 0 0 16px; padding: 0; text-align: left; }
  .ranks li { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,0.12); }
  .ranks li span:last-child { margin-left: auto; font-variant-numeric: tabular-nums; }
  button {
    font: inherit; font-weight: 800; font-size: 1.05rem;
    background: #ffc93c; color: #1c2242; border: 0; border-radius: 999px;
    padding: 10px 26px; cursor: pointer;
  }
  button:focus-visible { outline: 3px solid #ffffff; outline-offset: 3px; }
  @media (max-width: 560px) {
    #board { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    h1 { font-size: 1.3rem; }
  }
</style>
</head>
<body>
<header>
  <h1>Star <span>Snatch</span></h1>
  <p class="hint">Move with WASD or arrow keys (or hold a finger on the arena). Ram rivals at speed to knock a star loose.</p>
</header>
<div id="board"></div>
<div id="wrap">
  <div id="stage">
    <canvas id="game" aria-label="Star Snatch arena"></canvas>
    <div id="overlay">
      <div class="card" id="card"></div>
    </div>
  </div>
</div>

<script>
/* RULES:BEGIN */
var RULES = {
  ARENA: 800,
  SHIP_R: 22,
  STAR_R: 12,
  ACCEL: 820,
  FRICTION: 1.9,
  WALL_BOUNCE: 0.55,
  SHIP_BOUNCE: 0.9,
  BUMP_SPEED: 230,
  BUMP_COOLDOWN: 0.9,
  LOOSE_DELAY: 0.45,
  LOOSE_SPEED: 260,
  MAX_FIELD_STARS: 5,
  SPAWN_INTERVAL: 1.1,
  WIN_STARS: 10,
  MAX_PLAYERS: 4,
  SPAWN_POINTS: [[140, 140], [660, 660], [660, 140], [140, 660]]
};

function rulesRand(world) {
  world.seed = (Math.imul(world.seed, 1664525) + 1013904223) >>> 0;
  return world.seed / 4294967296;
}

function rulesFind(world, id) {
  for (var i = 0; i < world.players.length; i++) {
    if (world.players[i].id === id) return world.players[i];
  }
  return null;
}

function createWorld(seed) {
  return {
    arena: RULES.ARENA,
    time: 0,
    seed: (seed >>> 0) || 12345,
    players: [],
    stars: [],
    nextStarId: 1,
    spawnTimer: 0.3,
    phase: 'playing',
    winner: null,
    winStars: RULES.WIN_STARS
  };
}

function addPlayer(world, id, name, isBot) {
  if (rulesFind(world, id) || world.players.length >= RULES.MAX_PLAYERS) return null;
  var used = [];
  for (var i = 0; i < world.players.length; i++) used.push(world.players[i].slot);
  var slot = 0;
  while (used.indexOf(slot) !== -1) slot++;
  var sp = RULES.SPAWN_POINTS[slot];
  var p = {
    id: id, name: name, isBot: !!isBot, slot: slot,
    x: sp[0], y: sp[1], vx: 0, vy: 0, r: RULES.SHIP_R,
    stars: 0, cooldown: 0,
    input: { up: false, down: false, left: false, right: false }
  };
  world.players.push(p);
  return p;
}

function removePlayer(world, id) {
  world.players = world.players.filter(function (p) { return p.id !== id; });
}

function setInput(world, id, input) {
  var p = rulesFind(world, id);
  if (!p || !input) return;
  p.input = { up: !!input.up, down: !!input.down, left: !!input.left, right: !!input.right };
}

function rulesClamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

function rulesSpawnStar(world) {
  var best = null, bestScore = -1, m = 50;
  for (var k = 0; k < 8; k++) {
    var x = m + rulesRand(world) * (world.arena - 2 * m);
    var y = m + rulesRand(world) * (world.arena - 2 * m);
    var score = Infinity;
    for (var i = 0; i < world.players.length; i++) {
      var p = world.players[i];
      score = Math.min(score, Math.hypot(p.x - x, p.y - y));
    }
    for (var j = 0; j < world.stars.length; j++) {
      var s = world.stars[j];
      score = Math.min(score, Math.hypot(s.x - x, s.y - y) * 1.5);
    }
    if (score > bestScore) { bestScore = score; best = [x, y]; }
  }
  world.stars.push({ id: world.nextStarId++, x: best[0], y: best[1], vx: 0, vy: 0, delay: 0, loose: false });
}

function rulesWalls(o, r, arena, bounce) {
  if (o.x < r) { o.x = r; o.vx = Math.abs(o.vx) * bounce; }
  if (o.x > arena - r) { o.x = arena - r; o.vx = -Math.abs(o.vx) * bounce; }
  if (o.y < r) { o.y = r; o.vy = Math.abs(o.vy) * bounce; }
  if (o.y > arena - r) { o.y = arena - r; o.vy = -Math.abs(o.vy) * bounce; }
}

function step(world, dt) {
  var events = [];
  if (world.phase !== 'playing' || !(dt > 0)) return events;
  if (dt > 0.1) dt = 0.1;
  world.time += dt;
  var ps = world.players, i, j, p;
  var drag = Math.max(0, 1 - RULES.FRICTION * dt);

  for (i = 0; i < ps.length; i++) {
    if (ps[i].isBot) ps[i].input = botInput(world, ps[i].id);
  }

  // Thrust, drift, walls
  for (i = 0; i < ps.length; i++) {
    p = ps[i];
    var ax = (p.input.right ? 1 : 0) - (p.input.left ? 1 : 0);
    var ay = (p.input.down ? 1 : 0) - (p.input.up ? 1 : 0);
    if (ax !== 0 && ay !== 0) { ax *= Math.SQRT1_2; ay *= Math.SQRT1_2; }
    p.vx = (p.vx + ax * RULES.ACCEL * dt) * drag;
    p.vy = (p.vy + ay * RULES.ACCEL * dt) * drag;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    rulesWalls(p, p.r, world.arena, RULES.WALL_BOUNCE);
    if (p.cooldown > 0) p.cooldown = Math.max(0, p.cooldown - dt);
  }

  // Ship-to-ship collisions and rams
  for (i = 0; i < ps.length; i++) {
    for (j = i + 1; j < ps.length; j++) {
      var a = ps[i], b = ps[j];
      var dx = b.x - a.x, dy = b.y - a.y;
      var d = Math.hypot(dx, dy), minD = a.r + b.r;
      if (d >= minD) continue;
      var nx = 1, ny = 0;
      if (d > 0.0001) { nx = dx / d; ny = dy / d; }
      var push = (minD - d) / 2;
      a.x -= nx * push; a.y -= ny * push;
      b.x += nx * push; b.y += ny * push;
      var aToward = a.vx * nx + a.vy * ny;
      var bToward = -(b.vx * nx + b.vy * ny);
      var closing = aToward + bToward;
      if (closing <= 0) continue;
      var imp = closing * (1 + RULES.SHIP_BOUNCE) / 2;
      a.vx -= imp * nx; a.vy -= imp * ny;
      b.vx += imp * nx; b.vy += imp * ny;
      if (closing < RULES.BUMP_SPEED) continue;
      var attacker = aToward >= bToward ? a : b;
      var victim = attacker === a ? b : a;
      if (victim.cooldown > 0) continue;
      victim.cooldown = RULES.BUMP_COOLDOWN;
      events.push({ type: 'bump', a: attacker.id, b: victim.id });
      if (victim.stars > 0) {
        victim.stars--;
        var ux = attacker === a ? nx : -nx, uy = attacker === a ? ny : -ny;
        var side = (rulesRand(world) - 0.5) * 0.9;
        var sx = ux - uy * side, sy = uy + ux * side;
        var sl = Math.hypot(sx, sy) || 1;
        sx /= sl; sy /= sl;
        var off = victim.r + RULES.STAR_R + 4;
        world.stars.push({
          id: world.nextStarId++,
          x: rulesClamp(victim.x + sx * off, RULES.STAR_R, world.arena - RULES.STAR_R),
          y: rulesClamp(victim.y + sy * off, RULES.STAR_R, world.arena - RULES.STAR_R),
          vx: sx * RULES.LOOSE_SPEED, vy: sy * RULES.LOOSE_SPEED,
          delay: RULES.LOOSE_DELAY, loose: true
        });
      }
    }
  }

  // Loose stars drift and settle
  for (i = 0; i < world.stars.length; i++) {
    var s = world.stars[i];
    if (s.delay > 0) s.delay = Math.max(0, s.delay - dt);
    if (s.vx !== 0 || s.vy !== 0) {
      s.x += s.vx * dt; s.y += s.vy * dt;
      s.vx *= drag; s.vy *= drag;
      if (Math.abs(s.vx) + Math.abs(s.vy) < 4) { s.vx = 0; s.vy = 0; }
      rulesWalls(s, RULES.STAR_R, world.arena, 0.6);
    }
  }

  // Pickups
  for (i = world.stars.length - 1; i >= 0; i--) {
    var st = world.stars[i];
    if (st.delay > 0) continue;
    for (j = 0; j < ps.length; j++) {
      p = ps[j];
      if (Math.hypot(p.x - st.x, p.y - st.y) < p.r + RULES.STAR_R) {
        world.stars.splice(i, 1);
        p.stars++;
        events.push({ type: 'pickup', id: p.id });
        if (p.stars >= world.winStars && world.phase === 'playing') {
          world.phase = 'over';
          world.winner = p.id;
          events.push({ type: 'win', winner: p.id });
        }
        break;
      }
    }
    if (world.phase !== 'playing') return events;
  }

  // Spawning
  world.spawnTimer -= dt;
  if (world.spawnTimer <= 0) {
    world.spawnTimer = RULES.SPAWN_INTERVAL;
    if (world.stars.length < RULES.MAX_FIELD_STARS) rulesSpawnStar(world);
  }
  return events;
}

function botInput(world, id) {
  var none = { up: false, down: false, left: false, right: false };
  var me = rulesFind(world, id);
  if (!me) return none;
  // With no stars on the field, drift back to a home corner instead of clumping.
  var home = RULES.SPAWN_POINTS[me.slot % RULES.SPAWN_POINTS.length];
  var tx = home[0], ty = home[1], bestD = Infinity, i;
  for (i = 0; i < world.stars.length; i++) {
    var s = world.stars[i];
    var d = Math.hypot(s.x - me.x, s.y - me.y);
    if (d < bestD) { bestD = d; tx = s.x; ty = s.y; }
  }
  // Each bot has a different appetite for ramming, based on its slot.
  var ramRange = 110 + me.slot * 35;
  for (i = 0; i < world.players.length; i++) {
    var o = world.players[i];
    if (o.id === id) continue;
    var od = Math.hypot(o.x - me.x, o.y - me.y);
    var touching = od < me.r + o.r + 8;
    if (!touching && bestD < Infinity && od < ramRange && od < bestD * 0.6) { bestD = od; tx = o.x; ty = o.y; }
  }
  var dx = tx - me.x, dy = ty - me.y, len = Math.hypot(dx, dy);
  if (len < 6) return none;
  dx /= len; dy /= len;
  // Slide around ships that are in the way rather than shoving into them.
  for (i = 0; i < world.players.length; i++) {
    var n = world.players[i];
    if (n.id === id || (n.x === tx && n.y === ty)) continue;
    var ax = me.x - n.x, ay = me.y - n.y, ad = Math.hypot(ax, ay);
    var near = me.r + n.r + 30;
    if (ad > 0.001 && ad < near) {
      var wgt = (near - ad) / near * 1.2;
      dx += ax / ad * wgt; dy += ay / ad * wgt;
    }
  }
  // Push off nearby walls so bots don't get pinned in corners.
  var m = 70, A = world.arena;
  if (me.x < m) dx += (m - me.x) / m * 1.2;
  if (me.x > A - m) dx -= (me.x - (A - m)) / m * 1.2;
  if (me.y < m) dy += (m - me.y) / m * 1.2;
  if (me.y > A - m) dy -= (me.y - (A - m)) / m * 1.2;
  // A slow sideways weave per bot breaks up stalemates.
  var wv = Math.sin(world.time * 1.7 + me.slot * 2.1) * 0.35;
  var ox = -dy * wv, oy = dx * wv;
  dx += ox; dy += oy;
  len = Math.hypot(dx, dy);
  if (len < 0.05) return none;
  var k = 0.38;
  return {
    up: dy < -len * k,
    down: dy > len * k,
    left: dx < -len * k,
    right: dx > len * k
  };
}
/* RULES:END */

// ---------------------------------------------------------------------------
// Client: rendering, input, fixed 60 Hz loop. Nothing below changes the rules.
// ---------------------------------------------------------------------------
(function () {
  var COLORS = ['#ff6b6b', '#2ec4b6', '#b892ff', '#5fb3ff'];
  var BOT_NAMES = ['Comet', 'Nova', 'Quasar'];
  var HUMAN = 'human';
  var TICK = 1 / 60;

  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var stage = document.getElementById('stage');
  var wrap = document.getElementById('wrap');
  var overlay = document.getElementById('overlay');
  var card = document.getElementById('card');
  var board = document.getElementById('board');

  var world, running = false, resultsAt = 0, shake = 0;
  var particles = [], rings = [], trails = {}, headings = {};
  var keys = {}, pointer = null, boardKey = '';
  var scale = 1, dpr = 1;

  function newWorld() {
    world = createWorld(Date.now());
    addPlayer(world, HUMAN, 'You', false);
    for (var i = 0; i < BOT_NAMES.length; i++) addPlayer(world, 'bot' + (i + 1), BOT_NAMES[i], true);
    particles = []; rings = []; trails = {}; headings = {};
    resultsAt = 0; shake = 0; boardKey = '';
  }

  function colorOf(p) { return COLORS[p.slot % COLORS.length]; }

  // ---- Layout ----
  function resize() {
    var side = Math.floor(Math.min(wrap.clientWidth - 20, wrap.clientHeight - 14));
    side = Math.max(240, side);
    dpr = window.devicePixelRatio || 1;
    stage.style.width = side + 'px';
    stage.style.height = side + 'px';
    canvas.style.width = side + 'px';
    canvas.style.height = side + 'px';
    canvas.width = Math.round(side * dpr);
    canvas.height = Math.round(side * dpr);
    scale = canvas.width / RULES.ARENA;
  }
  window.addEventListener('resize', resize);

  // ---- Input ----
  var KEYMAP = {
    KeyW: 'up', ArrowUp: 'up', KeyS: 'down', ArrowDown: 'down',
    KeyA: 'left', ArrowLeft: 'left', KeyD: 'right', ArrowRight: 'right'
  };
  window.addEventListener('keydown', function (e) {
    if (KEYMAP[e.code]) { keys[KEYMAP[e.code]] = true; e.preventDefault(); }
    if ((e.code === 'Enter' || e.code === 'Space') && !overlay.hidden) {
      e.preventDefault();
      startGame();
    }
  });
  window.addEventListener('keyup', function (e) {
    if (KEYMAP[e.code]) keys[KEYMAP[e.code]] = false;
  });
  window.addEventListener('blur', function () { keys = {}; pointer = null; });

  function toWorld(e) {
    var r = canvas.getBoundingClientRect();
    return {
      x: (e.clientX - r.left) / r.width * RULES.ARENA,
      y: (e.clientY - r.top) / r.height * RULES.ARENA
    };
  }
  canvas.addEventListener('pointerdown', function (e) { pointer = toWorld(e); canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointermove', function (e) { if (pointer) pointer = toWorld(e); });
  canvas.addEventListener('pointerup', function () { pointer = null; });
  canvas.addEventListener('pointercancel', function () { pointer = null; });

  function humanInput() {
    var input = { up: !!keys.up, down: !!keys.down, left: !!keys.left, right: !!keys.right };
    var me = world.players.filter(function (p) { return p.id === HUMAN; })[0];
    if (pointer && me) {
      var dx = pointer.x - me.x, dy = pointer.y - me.y, len = Math.hypot(dx, dy);
      if (len > 12) {
        input.up = input.up || dy < -len * 0.38;
        input.down = input.down || dy > len * 0.38;
        input.left = input.left || dx < -len * 0.38;
        input.right = input.right || dx > len * 0.38;
      }
    }
    return input;
  }

  // ---- Events from the rules ----
  function find(id) {
    for (var i = 0; i < world.players.length; i++) if (world.players[i].id === id) return world.players[i];
    return null;
  }
  function burst(x, y, color, n, speed) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2, s = speed * (0.4 + Math.random() * 0.6);
      particles.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.6, max: 0.6, color: color });
    }
  }
  function handle(events) {
    for (var i = 0; i < events.length; i++) {
      var ev = events[i];
      if (ev.type === 'pickup') {
        var p = find(ev.id);
        if (p) burst(p.x, p.y, '#ffc93c', 12, 180);
      } else if (ev.type === 'bump') {
        var a = find(ev.a), b = find(ev.b);
        if (a && b) {
          var mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
          rings.push({ x: mx, y: my, life: 0.35, max: 0.35 });
          burst(mx, my, '#ffffff', 10, 260);
          if (a.id === HUMAN || b.id === HUMAN) shake = 10; else shake = Math.max(shake, 4);
        }
      } else if (ev.type === 'win') {
        var w = find(ev.winner);
        if (w) burst(w.x, w.y, colorOf(w), 40, 320);
        resultsAt = performance.now() + 900;
      }
    }
  }

  // ---- Scoreboard ----
  function updateBoard() {
    var key = world.players.map(function (p) { return p.id + ':' + p.stars; }).join('|');
    if (key === boardKey) return;
    boardKey = key;
    board.innerHTML = world.players.map(function (p) {
      var pct = Math.min(100, p.stars / world.winStars * 100);
      return '<div class="chip"><div class="chip-top">' +
        '<span class="dot" style="background:' + colorOf(p) + '"></span>' +
        '<span class="name">' + p.name + '</span>' +
        '<span class="count">' + p.stars + ' / ' + world.winStars + '</span></div>' +
        '<div class="bar"><div class="fill" style="width:' + pct + '%;background:' + colorOf(p) + '"></div></div></div>';
    }).join('');
  }

  // ---- Overlay screens ----
  function showStart() {
    card.innerHTML =
      '<h2>Star Snatch</h2>' +
      '<p>Grab the stars. Ram a rival at speed and one of their stars pops loose. First to ' +
      RULES.WIN_STARS + ' wins.</p>' +
      '<button id="go">Start</button>';
    overlay.hidden = false;
    document.getElementById('go').addEventListener('click', startGame);
    document.getElementById('go').focus();
  }
  function showResults() {
    var w = find(world.winner);
    var ranked = world.players.slice().sort(function (a, b) { return b.stars - a.stars; });
    card.innerHTML =
      '<h2>' + (w && w.id === HUMAN ? 'You win!' : (w ? w.name + ' wins' : 'Round over')) + '</h2>' +
      '<p>' + (w && w.id === HUMAN ? 'Ten stars, and they’re all yours.' : 'Ram them earlier next time.') + '</p>' +
      '<ul class="ranks">' + ranked.map(function (p) {
        return '<li><span class="dot" style="background:' + colorOf(p) + '"></span><span>' + p.name +
          '</span><span>' + p.stars + ' ★</span></li>';
      }).join('') + '</ul>' +
      '<button id="go">Play again</button>';
    overlay.hidden = false;
    document.getElementById('go').addEventListener('click', startGame);
    document.getElementById('go').focus();
  }
  function startGame() {
    newWorld();
    overlay.hidden = true;
    running = true;
    keys = {};
    canvas.focus && canvas.focus();
  }

  // ---- Drawing ----
  function starPath(x, y, ro, ri, rot) {
    ctx.beginPath();
    for (var i = 0; i < 10; i++) {
      var r = i % 2 ? ri : ro, a = rot + i * Math.PI / 5 - Math.PI / 2;
      ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
    }
    ctx.closePath();
  }

  function draw(now) {
    var t = now / 1000;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    var sx = shake ? (Math.random() - 0.5) * shake : 0, sy = shake ? (Math.random() - 0.5) * shake : 0;
    ctx.setTransform(scale, 0, 0, scale, sx * scale, sy * scale);

    // Arena
    var g = ctx.createRadialGradient(400, 400, 60, 400, 400, 620);
    g.addColorStop(0, '#24306a');
    g.addColorStop(1, '#121a3c');
    ctx.fillStyle = g;
    ctx.fillRect(-20, -20, 840, 840);
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    for (var gx = 50; gx < 800; gx += 50) {
      for (var gy = 50; gy < 800; gy += 50) ctx.fillRect(gx - 1, gy - 1, 2, 2);
    }
    ctx.strokeStyle = 'rgba(255,255,255,0.18)';
    ctx.lineWidth = 4;
    ctx.strokeRect(2, 2, 796, 796);

    // Stars
    for (var i = 0; i < world.stars.length; i++) {
      var s = world.stars[i];
      if (s.delay > 0 && Math.floor(t * 20) % 2) continue;
      var pulse = 1 + Math.sin(t * 4 + s.id) * 0.08;
      ctx.save();
      ctx.shadowColor = 'rgba(255,201,60,0.8)';
      ctx.shadowBlur = 16;
      ctx.fillStyle = '#ffc93c';
      starPath(s.x, s.y, RULES.STAR_R * 1.35 * pulse, RULES.STAR_R * 0.6 * pulse, t * 0.8 + s.id);
      ctx.fill();
      ctx.restore();
    }

    // Trails
    for (i = 0; i < world.players.length; i++) {
      var p = world.players[i], tr = trails[p.id] || (trails[p.id] = []);
      if (world.phase === 'playing') {
        tr.push(p.x, p.y);
        if (tr.length > 24) tr.splice(0, 2);
      }
      ctx.fillStyle = colorOf(p);
      for (var k = 0; k < tr.length; k += 2) {
        ctx.globalAlpha = (k / tr.length) * 0.25;
        ctx.beginPath();
        ctx.arc(tr[k], tr[k + 1], p.r * (0.35 + 0.5 * k / tr.length), 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    // Ships
    for (i = 0; i < world.players.length; i++) {
      p = world.players[i];
      var col = colorOf(p);
      var speed = Math.hypot(p.vx, p.vy);
      if (speed > 25) headings[p.id] = Math.atan2(p.vy, p.vx);
      var hd = headings[p.id] || 0;

      // Exhaust opposite to thrust
      var ix = (p.input.right ? 1 : 0) - (p.input.left ? 1 : 0);
      var iy = (p.input.down ? 1 : 0) - (p.input.up ? 1 : 0);
      if ((ix || iy) && world.phase === 'playing') {
        var ea = Math.atan2(-iy, -ix), fl = 14 + Math.random() * 10;
        ctx.fillStyle = 'rgba(255,170,80,0.85)';
        ctx.beginPath();
        ctx.moveTo(p.x + Math.cos(ea + 0.5) * p.r * 0.8, p.y + Math.sin(ea + 0.5) * p.r * 0.8);
        ctx.lineTo(p.x + Math.cos(ea) * (p.r + fl), p.y + Math.sin(ea) * (p.r + fl));
        ctx.lineTo(p.x + Math.cos(ea - 0.5) * p.r * 0.8, p.y + Math.sin(ea - 0.5) * p.r * 0.8);
        ctx.fill();
      }

      ctx.save();
      if (p.cooldown > 0) ctx.globalAlpha = 0.55 + 0.45 * Math.abs(Math.sin(t * 25));
      ctx.shadowColor = col;
      ctx.shadowBlur = 18;
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      // Nose
      ctx.beginPath();
      ctx.moveTo(p.x + Math.cos(hd) * (p.r + 9), p.y + Math.sin(hd) * (p.r + 9));
      ctx.lineTo(p.x + Math.cos(hd + 0.45) * (p.r - 2), p.y + Math.sin(hd + 0.45) * (p.r - 2));
      ctx.lineTo(p.x + Math.cos(hd - 0.45) * (p.r - 2), p.y + Math.sin(hd - 0.45) * (p.r - 2));
      ctx.fill();
      // Rim
      ctx.lineWidth = p.id === HUMAN ? 4 : 2.5;
      ctx.strokeStyle = p.id === HUMAN ? '#ffffff' : 'rgba(10,14,40,0.45)';
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.stroke();
      // Star count
      ctx.fillStyle = '#10163a';
      ctx.font = 'bold 20px "Trebuchet MS", system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(String(p.stars), p.x, p.y + 1);
      // Name
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.font = 'bold 14px "Trebuchet MS", system-ui, sans-serif';
      ctx.fillText(p.name, p.x, p.y - p.r - 14);
      ctx.restore();
    }

    // Bump rings
    for (i = 0; i < rings.length; i++) {
      var rg = rings[i], q = 1 - rg.life / rg.max;
      ctx.strokeStyle = 'rgba(255,255,255,' + (1 - q) + ')';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(rg.x, rg.y, 10 + q * 50, 0, Math.PI * 2);
      ctx.stroke();
    }

    // Particles
    for (i = 0; i < particles.length; i++) {
      var pt = particles[i];
      ctx.globalAlpha = Math.max(0, pt.life / pt.max);
      ctx.fillStyle = pt.color;
      ctx.fillRect(pt.x - 2.5, pt.y - 2.5, 5, 5);
    }
    ctx.globalAlpha = 1;
  }

  function updateEffects(dt) {
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= 0.92; p.vy *= 0.92;
      p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }
    for (i = rings.length - 1; i >= 0; i--) {
      rings[i].life -= dt;
      if (rings[i].life <= 0) rings.splice(i, 1);
    }
    shake = shake > 0.3 ? shake * 0.85 : 0;
  }

  // ---- Fixed-step loop ----
  var last = performance.now(), acc = 0;
  function frame(now) {
    var dt = Math.min(0.25, (now - last) / 1000);
    last = now;
    if (running) {
      acc += dt;
      while (acc >= TICK) {
        setInput(world, HUMAN, humanInput());
        handle(step(world, TICK));
        acc -= TICK;
      }
      if (resultsAt && now >= resultsAt) {
        resultsAt = 0;
        running = false;
        showResults();
      }
    } else {
      acc = 0;
    }
    updateEffects(dt);
    updateBoard();
    draw(now);
    requestAnimationFrame(frame);
  }

  newWorld();
  resize();
  showStart();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
